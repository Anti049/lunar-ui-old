name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint compares against the base branch and cannot with a
          # shallow clone.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: |
          bunx commitlint \
            --from origin/${{ github.base_ref }} \
            --to HEAD \
            --verbose

      - name: Lint and format check
        run: bun run lint

      # Per-package `check` is build + typecheck + tests + publint. Running the
      # build alone would happily pass on a plugin whose output no longer
      # matches its source.
      - name: Check every workspace
        run: bun run check

  # Runs only when the plugin changed. Packing and installing into a scratch app
  # is the only way to catch packaging bugs: a workspace link resolves to the
  # working tree and hides an empty `files` array or a wrong `exports` map.
  tarball:
    name: Packed tarball smoke test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Did the plugin change?
        id: changed
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^packages/core/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changed.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - if: steps.changed.outputs.run == 'true'
        name: Pack and install into a scratch app
        run: |
          cd packages/core
          bun run build
          npm pack --pack-destination /tmp
          cd /tmp
          bunx sv create app --template minimal --types ts --no-add-ons --no-install
          cd app
          bun add -d tailwindcss @tailwindcss/vite
          bun add /tmp/*project-name-*.tgz
          printf "@import 'tailwindcss';\n@plugin '@scope/project-name';\n" > src/app.css
          bunx @tailwindcss/cli -i src/app.css -o /tmp/out.css
          test -s /tmp/out.css
