name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Not cancel-in-progress: cancelling a release midway can leave some packages
# published and others not.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm provenance

jobs:
  release:
    name: Version PR or publish
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Never publish something unverified. A release workflow that only builds
      # will ship a plugin whose output no longer matches its source.
      - name: Verify
        run: bun run check

      - name: Build publishable packages
        run: bun run build:packages

      # Opens (or updates) a "Version Packages" PR while changesets are pending.
      # Once that PR merges, this same step publishes every bumped package.
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bunx changeset version
          publish: bunx changeset publish
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  # Gated on the release job so the site never documents a version that has not
  # published yet.
  docs:
    name: Deploy docs
    needs: release
    if: always() && needs.release.result == 'success'
    uses: ./.github/workflows/docs.yml
    secrets: inherit
