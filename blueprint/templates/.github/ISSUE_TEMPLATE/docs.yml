name: Documentation issue
description: Something in the docs is wrong, missing or confusing
labels: ['type:docs', 'area:docs']
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: URL or path
      placeholder: /components/tooltip
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - Wrong — the docs say something untrue
        - Missing — something is not documented
        - Confusing — accurate but hard to follow
        - Broken — a link, example or preview does not work
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: Detail
      description: What you expected to find, and what you found instead.
    validations:
      required: true
